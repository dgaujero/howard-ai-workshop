<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to content</a>
<header class="site-header">
  <div class="page-width">
    <p class="attribution">Howard University · Guest lecture</p>
    <a class="site-title" routerLink="/">AI Engineering Field Guide</a>
    <nav aria-label="Main navigation">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Task guides</a
      >
      <a routerLink="/workflow" routerLinkActive="active" ariaCurrentWhenActive="page"
        >The workflow</a
      >
      <a routerLink="/resources" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Resources</a
      >
      <a routerLink="/prompts" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Demo prompts</a
      >
    </nav>
  </div>
</header>
<main id="main-content" class="page-width" tabindex="-1">
  <router-outlet (activate)="onActivate()" />
</main>
<footer class="site-footer">
  <div class="page-width">
    <p>Prepared by Deion Aujero for the Howard University guest lecture.</p>
    <a [href]="repository">View the workshop repository</a>
  </div>
</footer>
